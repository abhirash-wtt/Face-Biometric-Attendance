<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Face Attendance</title>
  <style>
    :root { --bg:#07111f; --card:#102038; --line:#2a3d5c; --text:#f4f7fb; --muted:#9fb0c8; --accent:#2d6cdf; --ok:#1f8a70; --mint:#7ee0c5; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Segoe UI, system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; gap:8px; padding:10px 12px; border-bottom:1px solid #1b2b44; background:#0c182c; }
    header button { flex:1; background:transparent; color:var(--muted); border:0; padding:12px; font-weight:700; cursor:pointer; }
    header button.on { color:var(--mint); border-bottom:2px solid var(--mint); }
    main { max-width:720px; margin:0 auto; padding:16px; }
    h1 { margin:0 0 8px; font-size:28px; }
    .prompt { color:var(--mint); text-align:center; margin:8px 0 12px; }
    video, canvas { width:100%; height:320px; object-fit:cover; background:#0b1220; border-radius:16px; }
    .row { display:flex; gap:10px; margin-top:12px; }
    button.cta, button.alt, button.toggle { border:0; border-radius:12px; padding:14px; font-weight:800; cursor:pointer; color:#fff; }
    button.cta { background:var(--accent); width:100%; margin-top:12px; }
    button.alt { background:var(--ok); width:100%; margin-top:8px; }
    button.toggle { flex:1; background:transparent; border:1px solid var(--line); color:var(--muted); }
    button.toggle.on { background:var(--ok); border-color:var(--ok); color:#fff; }
    input { width:100%; background:transparent; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:10px 12px; margin:4px 0 10px; }
    label { color:var(--muted); font-size:13px; }
    .status { text-align:center; color:#c5d2e4; margin-top:12px; min-height:24px; }
    .list { max-height:150px; overflow:auto; margin-bottom:10px; }
    .emp { display:flex; gap:10px; padding:8px; border-bottom:1px solid #22344f; cursor:pointer; }
    .emp.on { background:#123348; }
    .code { color:var(--mint); width:80px; font-weight:700; }
    dialog { border:0; border-radius:16px; background:#152238; color:var(--text); padding:22px; width:min(420px, 92vw); }
    dialog::backdrop { background:rgba(4,10,22,.72); }
    .hidden { display:none; }
    .rbac-hide { display:none !important; }
    .role-badge { color:var(--mint); font-size:13px; margin:0 0 10px; }
  </style>
</head>
<body>
  <header>
    <button class="on" data-tab="kiosk">Kiosk</button>
    <button data-tab="enroll" id="enrollTabBtn">Enroll</button>
    <button data-tab="settings">Settings</button>
  </header>
  <main>
    <div id="cameraPanel">
      <p class="prompt" id="livenessPrompt">Please blink twice</p>
      <video id="cam" autoplay playsinline webkit-playsinline muted></video>
    </div>
    <section id="kiosk">
      <h1>Face Attendance</h1>
      <div class="row">
        <button class="toggle on" data-punch="IN">IN</button>
        <button class="toggle" data-punch="OUT">OUT</button>
      </div>
      <button class="cta" id="clockBtn">Clock IN</button>
      <p class="status" id="kioskStatus"></p>
    </section>
    <section id="enroll" class="hidden">
      <h1>Enroll faces</h1>
      <input id="search" placeholder="Search code or name" />
      <button class="cta" id="searchBtn" style="margin-top:0">Search</button>
      <div class="list" id="empList"></div>
      <button class="cta" id="sampleBtn">Capture sample</button>
      <p class="status" id="enrollStatus">Select an employee. Confirm your face is visible above, then capture 3–5 samples.</p>
    </section>
    <section id="settings" class="hidden">
      <h1>Settings</h1>
      <p class="role-badge" id="roleBadge">Not signed in</p>
      <label>API URL</label><input id="apiBase" />
      <label>Device ID</label><input id="deviceId" />
      <label>Site code</label><input id="siteCode" />
      <div id="adminBindBlock">
        <label>Device bind secret</label><input id="secret" />
      </div>
      <button class="cta" id="saveBtn">Save</button>
      <p style="color:#7ee0c5;font-weight:700">Login</p>
      <label>Email</label><input id="email" />
      <label>Password</label><input id="password" type="password" />
      <button class="cta" id="loginBtn">Login</button>
      <button class="alt" id="logoutBtn">Logout</button>
      <button class="alt" id="bindBtn">Register this device</button>
      <button class="alt" id="syncBtn">Sync offline queue</button>
      <p class="status" id="settingsStatus"></p>
    </section>
  </main>
  <dialog id="confirm">
    <h2 id="confirmTitle"></h2>
    <p id="confirmMsg"></p>
    <div class="row">
      <button class="toggle" id="cancelBtn">Cancel</button>
      <button class="cta" id="okBtn" style="margin:0">Confirm</button>
    </div>
  </dialog>
  <script>
    const prompts = [
      ['blink', 'Please blink twice'],
      ['turn_left', 'Turn your head left, then face the camera'],
      ['turn_right', 'Turn your head right, then face the camera'],
      ['smile', 'Please smile'],
    ];
    const state = {
      tab: 'kiosk',
      punch: 'IN',
      token: localStorage.getItem('access_token') || '',
      refreshToken: localStorage.getItem('refresh_token') || '',
      settings: JSON.parse(localStorage.getItem('settings') || 'null') || {
        apiBase: location.origin,
        deviceId: 'KIOSK-01',
        siteCode: 'HQ',
        bootstrapSecret: 'bind-device-once',
      },
      employees: [],
      selected: null,
      samples: 0,
      pending: null,
      queue: JSON.parse(localStorage.getItem('offline_queue') || '[]'),
    };
    let refreshInFlight = null;

    const $ = (id) => document.getElementById(id);
    function status(id, msg) { $(id).textContent = msg; }
    function rollPrompt() {
      const p = prompts[Math.floor(Math.random() * prompts.length)];
      $('livenessPrompt').textContent = p[1];
    }
    function saveSettings() {
      localStorage.setItem('settings', JSON.stringify(state.settings));
    }
    function decodeJwt(token) {
      if (!token) return null;
      try {
        const part = token.split('.')[1];
        if (!part) return null;
        const b64 = part.replace(/-/g, '+').replace(/_/g, '/');
        const padded = b64 + '='.repeat((4 - (b64.length % 4)) % 4);
        return JSON.parse(atob(padded));
      } catch {
        return null;
      }
    }
    function isJwtExpired(token, skewMs) {
      const payload = decodeJwt(token);
      if (!payload || !payload.exp) return !token;
      return payload.exp * 1000 < Date.now() + (skewMs || 20000);
    }
    function jwtRole() {
      const payload = decodeJwt(state.token);
      if (!payload || isJwtExpired(state.token, 0)) return '';
      if (payload.role === 'admin') return 'admin';
      if (payload.role) return 'user';
      return '';
    }
    function authUser() {
      try { return JSON.parse(localStorage.getItem('auth_user') || 'null'); } catch { return null; }
    }
    function setSession(res) {
      state.token = res.access_token || '';
      localStorage.setItem('access_token', state.token);
      if (res.refresh_token) {
        state.refreshToken = res.refresh_token;
        localStorage.setItem('refresh_token', res.refresh_token);
      } else if (!res.keep_refresh) {
        state.refreshToken = '';
        localStorage.removeItem('refresh_token');
      }
      if (res.user) {
        localStorage.setItem('auth_user', JSON.stringify(res.user));
        if (res.user.email) localStorage.setItem('login_email', res.user.email);
      } else if (!res.keep_user) {
        localStorage.removeItem('auth_user');
      }
    }
    function clearSession() {
      state.token = '';
      state.refreshToken = '';
      localStorage.removeItem('access_token');
      localStorage.removeItem('refresh_token');
      localStorage.removeItem('auth_user');
    }
    async function refreshSession() {
      const rt = state.refreshToken || localStorage.getItem('refresh_token');
      if (!rt) return false;
      if (refreshInFlight) return refreshInFlight;
      refreshInFlight = (async () => {
        try {
          const res = await fetch(state.settings.apiBase.replace(/\/$/, '') + '/auth/refresh', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ refresh_token: rt }),
          });
          const text = await res.text();
          let data = null;
          try { data = text ? JSON.parse(text) : null; } catch { data = null; }
          if (!res.ok || !data || !data.access_token) return false;
          setSession(data);
          return true;
        } catch {
          return false;
        } finally {
          refreshInFlight = null;
        }
      })();
      return refreshInFlight;
    }
    async function restoreSession() {
      state.token = localStorage.getItem('access_token') || '';
      state.refreshToken = localStorage.getItem('refresh_token') || '';
      if (state.refreshToken && (!state.token || isJwtExpired(state.token))) {
        const ok = await refreshSession();
        if (!ok) clearSession();
      } else if (state.token && isJwtExpired(state.token)) {
        clearSession();
      }
    }
    function applyAccess() {
      const role = jwtRole();
      const isAdmin = role === 'admin';
      const user = authUser();
      $('enrollTabBtn').classList.toggle('rbac-hide', !isAdmin);
      $('adminBindBlock').classList.toggle('rbac-hide', role === 'user');
      $('bindBtn').classList.toggle('rbac-hide', role === 'user');
      if (role && user && user.email) {
        $('roleBadge').textContent = 'Signed in as ' + user.email + ' (' + role + ')';
      } else if (role) {
        $('roleBadge').textContent = 'Signed in as ' + role;
      } else {
        $('roleBadge').textContent = 'Not signed in';
      }
      if (!isAdmin && state.tab === 'enroll') {
        state.tab = 'kiosk';
        document.querySelectorAll('header button').forEach((x) => x.classList.toggle('on', x.dataset.tab === 'kiosk'));
        ['kiosk','enroll','settings'].forEach((id) => $(id).classList.toggle('hidden', id !== 'kiosk'));
        $('cameraPanel').classList.remove('hidden');
        $('livenessPrompt').style.visibility = 'visible';
      }
    }
    function getGps() {
      const opts = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('Location is required'));
        const samples = [];
        let watchId;
        const finish = (err) => {
          if (watchId != null) navigator.geolocation.clearWatch(watchId);
          if (samples.length) {
            samples.sort((a, b) => (a.accuracy || 999) - (b.accuracy || 999));
            return resolve(samples[0]);
          }
          if (err) return reject(err);
          reject(new Error('Location is required. Allow GPS and stand inside the office.'));
        };
        const onPos = (p) => {
          samples.push({
            lat: p.coords.latitude,
            lng: p.coords.longitude,
            accuracy: p.coords.accuracy,
          });
        };
        navigator.geolocation.getCurrentPosition(onPos, () => {}, opts);
        watchId = navigator.geolocation.watchPosition(onPos, () => {}, opts);
        setTimeout(() => finish(), 2500);
      });
    }
    async function api(path, opts = {}) {
      const headers = {};
      if (state.token) headers.Authorization = 'Bearer ' + state.token;
      if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
      const res = await fetch(state.settings.apiBase.replace(/\/$/, '') + path, {
        method: opts.method || 'GET',
        headers,
        body: opts.body ? (opts.body instanceof FormData ? opts.body : JSON.stringify(opts.body)) : undefined,
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (res.status === 401 && !opts._retry && path !== '/auth/login' && path !== '/auth/refresh') {
        const ok = await refreshSession();
        if (ok) return api(path, Object.assign({}, opts, { _retry: true }));
        clearSession();
        applyAccess();
      }
      if (!res.ok) {
        const msg = data && data.message ? data.message : res.statusText;
        throw new Error(Array.isArray(msg) ? msg.join(', ') : String(msg));
      }
      return data;
    }
    function identifyFailMessage(reason) {
      if (reason === 'identity_mismatch') return 'Face does not match this login';
      if (reason === 'no_templates') return 'No face enrolled for this login';
      if (reason === 'employee_not_found') return 'This employee account is not active';
      return 'Please try again';
    }
    async function startCam() {
      const v = $('cam');
      v.muted = true;
      v.autoplay = true;
      v.playsInline = true;
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      } catch {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
      v.srcObject = stream;
      try { await v.play(); } catch { /* Chrome autoplay can reject; stream still attaches */ }
      await waitForFrame(v, 2500);
    }
    function frameSize(v) {
      const track = v.srcObject && v.srcObject.getVideoTracks && v.srcObject.getVideoTracks()[0];
      const s = track && track.getSettings ? track.getSettings() : {};
      return {
        width: v.videoWidth || s.width || v.clientWidth || 640,
        height: v.videoHeight || s.height || v.clientHeight || 480,
      };
    }
    async function waitForFrame(v, ms) {
      const deadline = Date.now() + (ms || 2500);
      while (Date.now() < deadline) {
        if (v.readyState >= 2 && (v.videoWidth > 0 || (v.srcObject && v.srcObject.active))) return;
        await new Promise((r) => setTimeout(r, 50));
      }
    }
    async function captureB64() {
      const v = $('cam');
      if (!v.srcObject) await startCam();
      await waitForFrame(v, 2500);
      try { if (v.paused) await v.play(); } catch {}
      const size = frameSize(v);
      const c = document.createElement('canvas');
      c.width = size.width;
      c.height = size.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(v, 0, 0, c.width, c.height);
      const pixels = ctx.getImageData(0, 0, c.width, c.height).data;
      let sum = 0;
      const count = pixels.length / 4;
      for (let i = 0; i < pixels.length; i += 4) sum += pixels[i] + pixels[i + 1] + pixels[i + 2];
      if (count > 0 && sum / count / 3 < 8) {
        throw new Error('Captured frame is too dark. Allow the camera in Chrome, keep this tab visible, then try again.');
      }
      return c.toDataURL('image/jpeg', 0.85).replace(/^data:image\/\w+;base64,/, '');
    }

    document.querySelectorAll('header button').forEach((b) => {
      b.onclick = () => {
        if (b.dataset.tab === 'enroll' && jwtRole() !== 'admin') return;
        state.tab = b.dataset.tab;
        document.querySelectorAll('header button').forEach((x) => x.classList.toggle('on', x === b));
        ['kiosk','enroll','settings'].forEach((id) => $(id).classList.toggle('hidden', id !== state.tab));
        $('cameraPanel').classList.toggle('hidden', state.tab === 'settings');
        $('livenessPrompt').style.visibility = state.tab === 'kiosk' ? 'visible' : 'hidden';
      };
    });
    document.querySelectorAll('button.toggle[data-punch]').forEach((b) => {
      b.onclick = () => {
        state.punch = b.dataset.punch;
        document.querySelectorAll('button.toggle[data-punch]').forEach((x) => x.classList.toggle('on', x === b));
        $('clockBtn').textContent = 'Clock ' + state.punch;
      };
    });

    $('clockBtn').onclick = async () => {
      try {
        status('kioskStatus', 'Checking liveness…');
        const image_b64 = await captureB64();
        const gps = await getGps().catch(() => null);
        if (!gps) return status('kioskStatus', 'Location is required. Allow GPS and stand inside the office.');
        const res = await api('/attend/identify', {
          method: 'POST',
          body: {
            device_id: state.settings.deviceId,
            site_code: state.settings.siteCode,
            gps,
            image_b64,
            liveness: 0.95,
          },
        });
        const minSim = (res.thresholds && res.thresholds.similarity) || 0.97;
        const minLive = (res.thresholds && res.thresholds.liveness) || 0.6;
        if (res.ok && res.similarity >= minSim && res.liveness >= minLive && res.employee_id) {
          state.pending = { ...res, image_b64, gps };
          $('confirmTitle').textContent = 'Welcome ' + res.name;
          $('confirmMsg').textContent = 'Similarity ' + Number(res.similarity).toFixed(2) + ' · Liveness ' + Number(res.liveness).toFixed(2) + '\nConfirm clock ' + state.punch + '?';
          $('confirm').showModal();
          status('kioskStatus', 'Matched ' + res.name);
        } else {
          status('kioskStatus', identifyFailMessage(res.reason));
          rollPrompt();
        }
      } catch (e) {
        status('kioskStatus', e.message || 'Please try again');
      }
    };

    $('okBtn').onclick = async () => {
      const p = state.pending;
      $('confirm').close();
      if (!p) return;
      try {
        let gps = p.gps;
        try { gps = await getGps(); } catch {}
        await api('/attendance', {
          method: 'POST',
          body: {
            employee_id: p.employee_id,
            type: state.punch,
            device_id: state.settings.deviceId,
            site_code: state.settings.siteCode,
            gps,
            similarity: p.similarity,
            liveness_score: p.liveness,
            face_crop_url: p.face_crop_url,
            image_b64: p.image_b64,
          },
        });
        status('kioskStatus', 'Welcome ' + p.name);
        rollPrompt();
      } catch (e) {
        const msg = e.message || '';
        if (/geofence|location is required|outside office|not linked|does not match|Face verification required|only clock in|No face enrolled/i.test(msg)) {
          status('kioskStatus', msg);
        } else {
          state.queue.push({
            path: '/attendance',
            body: {
              employee_id: p.employee_id,
              type: state.punch,
              gps: p.gps,
              similarity: p.similarity,
              liveness_score: p.liveness,
              face_crop_url: p.face_crop_url,
              image_b64: p.image_b64,
            },
            createdAt: Date.now(),
          });
          localStorage.setItem('offline_queue', JSON.stringify(state.queue));
          status('kioskStatus', 'Saved offline: ' + msg);
        }
      }
      state.pending = null;
    };
    $('cancelBtn').onclick = () => { $('confirm').close(); state.pending = null; };

    async function loadEmployees() {
      const q = $('search').value.trim();
      state.employees = await api('/employees' + (q ? ('?q=' + encodeURIComponent(q)) : ''));
      $('empList').innerHTML = state.employees.map((e) =>
        '<div class="emp' + (state.selected && state.selected.id === e.id ? ' on' : '') + '" data-id="' + e.id + '"><span class="code">' + e.code + '</span><span>' + e.display_name + '</span></div>'
      ).join('');
      $('empList').querySelectorAll('.emp').forEach((el) => {
        el.onclick = () => {
          state.selected = state.employees.find((x) => x.id === el.dataset.id);
          state.samples = 0;
          status('enrollStatus', 'Enrolling ' + state.selected.display_name + ' (' + state.selected.code + ')');
          loadEmployees().catch(() => {});
        };
      });
    }
    $('searchBtn').onclick = () => loadEmployees().catch((e) => status('enrollStatus', e.message));
    $('sampleBtn').onclick = async () => {
      if (!state.selected) return status('enrollStatus', 'Select an employee first');
      try {
        await api('/enroll', { method: 'POST', body: { employee_id: state.selected.id, image_b64: await captureB64(), liveness_score: 0.95 } });
        state.samples += 1;
        status('enrollStatus', 'Saved sample ' + state.samples + ' for ' + state.selected.display_name);
      } catch (e) { status('enrollStatus', e.message); }
    };

    function fillSettings() {
      $('apiBase').value = state.settings.apiBase;
      $('deviceId').value = state.settings.deviceId;
      $('siteCode').value = state.settings.siteCode;
      $('secret').value = state.settings.bootstrapSecret;
      $('email').value = localStorage.getItem('login_email') || 'admin@attendance.local';
      $('password').value = state.token ? '' : 'Admin@123';
    }
    $('saveBtn').onclick = () => {
      state.settings = { apiBase: $('apiBase').value, deviceId: $('deviceId').value, siteCode: $('siteCode').value, bootstrapSecret: $('secret').value };
      saveSettings();
      status('settingsStatus', 'Settings saved');
    };
    $('loginBtn').onclick = async () => {
      try {
        const res = await api('/auth/login', { method: 'POST', body: { email: $('email').value, password: $('password').value } });
        setSession(res);
        $('password').value = '';
        applyAccess();
        status('settingsStatus', 'Logged in as ' + (res.user && res.user.email ? res.user.email : res.user.role));
      } catch (e) { status('settingsStatus', e.message); }
    };
    $('bindBtn').onclick = async () => {
      try {
        $('saveBtn').onclick();
        const res = await api('/devices/register', {
          method: 'POST',
          body: { device_id: state.settings.deviceId, site_code: state.settings.siteCode, bootstrap_secret: state.settings.bootstrapSecret, description: 'Kiosk' },
        });
        setSession(res);
        applyAccess();
        status('settingsStatus', 'Device bound: ' + res.device.device_id);
      } catch (e) { status('settingsStatus', e.message); }
    };
    $('logoutBtn').onclick = () => {
      clearSession();
      applyAccess();
      status('settingsStatus', 'Signed out');
    };
    $('syncBtn').onclick = async () => {
      const remain = [];
      for (const item of state.queue) {
        try { await api(item.path, { method: 'POST', body: item.body }); }
        catch { remain.push(item); }
      }
      state.queue = remain;
      localStorage.setItem('offline_queue', JSON.stringify(remain));
      status('settingsStatus', 'Synced. Remaining: ' + remain.length);
    };

    fillSettings();
    applyAccess();
    restoreSession().then(() => {
      fillSettings();
      applyAccess();
    });
    rollPrompt();
    startCam().catch((e) => status('kioskStatus', e.message));
  </script>
</body>
</html>
