# Credentials come from the API's env file so there is a single source of truth:
#
#   docker compose --env-file attendance-api/.env up -d db minio redis
version: "3.8"
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DATABASE_USER:-app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in attendance-api/.env and pass --env-file attendance-api/.env}
      POSTGRES_DB: ${DATABASE_NAME:-attendance}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in attendance-api/.env and pass --env-file attendance-api/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in attendance-api/.env and pass --env-file attendance-api/.env}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./minio:/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # optional face engine
  compreface:
    image: exadel/compreface:latest
    ports: ["8000:8000"]
    depends_on: [db]
    profiles: ["compreface"]

  api:
    build: ./attendance-api
    ports: ["3000:3000"]
    env_file: ./attendance-api/.env
    environment:
      DATABASE_HOST: db
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      STORAGE_PROVIDER: minio
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

volumes:
  pgdata:
