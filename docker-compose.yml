version: "3.8"
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: attendance
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./minio:/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # optional face engine
  compreface:
    image: exadel/compreface:latest
    ports: ["8000:8000"]
    depends_on: [db]
    profiles: ["compreface"]

  api:
    build: ./attendance-api
    ports: ["3000:3000"]
    env_file: ./attendance-api/.env
    environment:
      DATABASE_HOST: db
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      STORAGE_PROVIDER: minio
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

volumes:
  pgdata:
