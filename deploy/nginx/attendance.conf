# TLS reverse proxy for the attendance API and kiosk UI.
# Install: copy to /etc/nginx/sites-available/attendance, symlink into sites-enabled,
# replace attendance.example.com and the certificate paths, then `nginx -t && systemctl reload nginx`.
# Browsers only expose camera and GPS on HTTPS, so the kiosk must be served from here.

server {
    listen 80;
    listen [::]:80;
    server_name attendance.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name attendance.example.com;

    ssl_certificate     /etc/ssl/attendance/fullchain.pem;
    ssl_certificate_key /etc/ssl/attendance/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The API accepts JSON bodies up to 15 MB (base64 face captures).
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The server-webcam routes trust requests from 127.0.0.1, which every proxied request
    # appears to come from, so they must never be reachable through the proxy.
    location /camera/ {
        return 404;
    }
}
