# Production overrides for the company server. Run with the API's env file so the
# database and MinIO credentials have a single source of truth:
#
#   docker compose --env-file attendance-api/.env \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires Docker Compose v2.24+ for !reset / !override.
services:
  db:
    environment:
      POSTGRES_USER: ${DATABASE_USER:?set DATABASE_USER in attendance-api/.env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in attendance-api/.env}
      POSTGRES_DB: ${DATABASE_NAME:?set DATABASE_NAME in attendance-api/.env}
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    restart: unless-stopped

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in attendance-api/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in attendance-api/.env}
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  api:
    # Only Nginx on the same host may reach the API; it terminates TLS.
    ports: !override ["127.0.0.1:3000:3000"]
    environment:
      NODE_ENV: production
      HTTPS_ENABLED: "false"
      # Nginx on the host reaches the container via the Docker bridge gateway (a private
      # address). Safe only because the API port is bound to 127.0.0.1 above.
      TRUST_PROXY: "loopback, uniquelocal"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
